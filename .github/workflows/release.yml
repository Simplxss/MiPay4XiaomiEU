name: Release

on:
  push:
    tags:
      - "v*.*.*"
  

jobs:
  build-module:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils erofsfuse wget unzip xz-utils
          wget https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
          tar -xvf payload-dumper-go_2.1.0_linux_amd64.tar.gz
          chmod +x payload-dumper-go

      - name: Download HyperOS
        run: |
          wget https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.32.XPCCNXM/pudding-ota_full-OS4.0.0.32.XPCCNXM-user-17.0-f9afe18d6e.zip
          unzip *.zip payload.bin
          rm *.zip

      - name: Unpack HyperOS
        run: |
          ./payload-dumper-go -o ./ -p product ./payload.bin
          rm payload.bin
          mkdir product
          fsck.erofs product.img --extract=product
          df -h
          free -h

      - name: Assemble module
        run: |
          cp -a ./product/app/MINextpay ./module/product/app/MINextpay
          cp -a ./product/app/MITSMClient ./module/product/app/MITSMClient
          cp -a ./product/app/UPTsmService ./module/product/app/UPTsmService
          # cp -a ./product/app/MIUISuperMarket ./module/system/app/MIUISuperMarket
          rm ./module/system/app/.gitkeep

      - name: Package module
        run: |
          cd module/
          zip -r ../MiPay4XiaomiEU.zip *

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: MiPay4XiaomiEU.zip
